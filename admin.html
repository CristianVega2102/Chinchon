<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chinchón · Administrador</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1b15;--panel:#15271e;--line:#22392d;--gold:#f2c14e;--ink:#e8f0ea;--mute:#8fa597;--ok:#5fd08a;--bad:#e8665a;--sans:'Plus Jakarta Sans',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:520px;padding:14px 14px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
h1{font-size:20px;font-weight:800}h2{font-size:16px;font-weight:800}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:5px}
input{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0e1b15;color:var(--ink)}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px;font-size:14px;cursor:pointer}
button:disabled{opacity:.4}
.b1{background:var(--gold);color:#2a2100}.b2{background:#1d3a2c;color:var(--ok)}.b3{background:none;color:var(--mute)}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.mono{font-family:var(--mono);font-weight:700}.gold{color:var(--gold)}.note{color:var(--mute);font-size:12px}
.err{color:var(--bad);font-size:13px;font-weight:700}.okm{color:var(--ok);font-size:13px;font-weight:700}
.u{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.mv{display:flex;justify-content:space-between;font-size:13px;gap:8px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,onSnapshot,collection,query,orderBy,limit,where,setDoc,updateDoc,writeBatch,increment,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyCkJfAUeCfppXpnB4K6I8z5u_OmsH5AcxY",
  authDomain:"chinchon-mesa.firebaseapp.com",
  projectId:"chinchon-mesa",
  storageBucket:"chinchon-mesa.firebasestorage.app",
  messagingSenderId:"973919776041",
  appId:"1:973919776041:web:b3fbf3e89b1d48c46c9b38"
});
const auth=getAuth(app),db=getFirestore(app),A=document.getElementById('app');
const fmt=n=>'$'+Math.round(n).toLocaleString('es-AR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let U=null,me=null,cfg={comision:10,entradas:[500,1000,2000],turno:20,espera:40,reenganche:0,segReeng:20,whatsapp:''},us=[],mv=[],fx=[],fxOk=false,rk=[],q='',err='',ok='',unsubs=[];

onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];U=u;me=null;us=[];mv=[];fx=[];fxOk=false;rk=[];pd=[];
  if(u){
    unsubs.push(onSnapshot(doc(db,'users',u.uid),s=>{
      const was=me&&me.admin;me=s.exists()?s.data():null;
      if(me&&me.admin&&!was){
        unsubs.push(onSnapshot(collection(db,'users'),s=>{us=s.docs.map(d=>({id:d.id,...d.data()}));lista()}));
        unsubs.push(onSnapshot(query(collection(db,'movimientos'),orderBy('creado','desc'),limit(15)),s=>{mv=s.docs.map(d=>d.data());hist()}));
        unsubs.push(onSnapshot(doc(db,'config','general'),s=>{if(s.exists())cfg={...cfg,...s.data()};view()}));
        unsubs.push(onSnapshot(query(collection(db,'mesas'),where('estado','==','esperando')),s=>{fx=s.docs.map(d=>({id:d.id,...d.data()}));if(!fxOk){fxOk=true;view()}else estados()}));
        unsubs.push(onSnapshot(collection(db,'ranking'),s=>{rk=s.docs.map(d=>({id:d.id,...d.data()}));rkv()}));
        unsubs.push(()=>{if(unPart)unPart();unPart=null});subPartidas();
      }
      view();
    }));
  }
  view();
});

function view(){
  if(!U)return A.innerHTML=`<h1>Administrador</h1><form class="card" id="f"><input name="email" type="email" placeholder="Correo" required><input name="pass" type="password" placeholder="Contraseña" required>${err?`<div class="err">${err}</div>`:''}<button class="b1">Entrar</button></form>`;
  if(!me)return A.innerHTML='<p class="note">Cargando…</p>';
  if(!me.admin)return A.innerHTML=`<h1>Sin permiso</h1><p class="note">Esta cuenta no es de administrador.</p><button class="b2" data-a="salir">Salir</button>`;
  A.innerHTML=`<div class="row"><h1>Administrador</h1><button class="b3" data-a="salir">Salir</button></div>
  <form class="card" id="cf"><h2>Configuración</h2>
    <label>Comisión de la casa (%, de 0 a 50)<input name="com" type="number" min="0" max="50" step="1" value="${cfg.comision}"></label>
    <label>Segundos por turno (10 a 120)<input name="tur" type="number" min="10" max="120" step="1" value="${cfg.turno||20}"></label>
    <label>Segundos de espera entre manos (10 a 120)<input name="esp" type="number" min="10" max="120" step="1" value="${cfg.espera||40}"></label>
    <label>Segundos para reengancharse (5 a 120)<input name="sre" type="number" min="5" max="120" step="1" value="${cfg.segReeng||20}"></label>
    <label>Costo del reenganche (0 = igual a la entrada de cada mesa)<input name="ree" type="number" min="0" max="100000" step="1" value="${cfg.reenganche||0}"></label>
    <label>Entradas permitidas (separadas por coma)<input name="ent" value="${cfg.entradas.join(', ')}"></label>
    <label>WhatsApp para cargas (solo números, con código de país. Ej: 5493815551234)<input name="wa" inputmode="numeric" value="${esc(cfg.whatsapp||'')}"></label>
    ${err?`<div class="err">${err}</div>`:''}${ok?`<div class="okm">${ok}</div>`:''}
    <button class="b1">Guardar configuración</button></form>
  ${fijasHTML()}
  ${pruebaCard()}
  ${progCard()}
  ${partidasCard()}
  ${rankCard()}
  <div class="card"><h2>Jugadores</h2><div class="note" id="cont"></div><input id="q" placeholder="Buscar por nombre o código" value="${esc(q)}" aria-label="Buscar jugador"><div id="lista"></div></div>
  <div class="card"><h2>Últimos movimientos</h2><div id="hist"></div></div>`;
  lista();hist();estados();rkv();ptv();
}
const FIJAS=[[4,'Mesa principal']];
let fm={t:'',bad:false};
function tabla(){
  return rk.map(x=>({id:x.id,name:x.name||'?',j:x.jugadas||0,g:x.ganadas||0,p:x.perdidas||0})).filter(x=>x.j>0)
    .sort((a,b)=>b.g-a.g||(b.g/b.j)-(a.g/a.j)||b.j-a.j||a.name.localeCompare(b.name));
}
const pc=x=>Math.round(x.g*100/x.j)+'%';
function fijasHTML(){
  return `<form class="card" id="mf"><h2>Mesa principal</h2><p class="note">Mesa de hasta 4 jugadores, siempre disponible. Empieza sola con una cuenta de 20 segundos (si se suma alguien, la cuenta vuelve a empezar) y se vuelve a abrir vacía. Para cambiar la entrada o los puntos, tiene que estar sin jugadores.</p>`
  +FIJAS.map(([n,nom])=>{const m=fx.find(x=>x.id==='mesa-'+n),en=m?m.entrada:(cfg.entradas[0]||0),li=m?m.limite:100;
    return `<div class="u"><div class="row"><b>${nom}</b><span id="st-${n}" class="note"></span></div>
    <div class="row"><label style="flex:1">Entrada (0 = gratis)<input name="e${n}" type="number" min="0" max="100000" step="1" value="${en}"></label>
    <label style="flex:1">Puntos para eliminar<input name="l${n}" type="number" min="20" max="500" step="10" value="${li}"></label></div></div>`}).join('')
  +(fm.t?`<div class="${fm.bad?'err':'okm'}">${esc(fm.t)}</div>`:'')
  +`<div id="viejas"></div><button class="b1">Crear / guardar la mesa principal</button></form>`;
}
let pm={t:'',bad:false};
function progCard(){
  const m=fx.find(x=>x.id==='mesa-prog'),en=m?m.entrada:(cfg.entradas[0]||0),li=m?m.limite:100,mx=m?m.max:4;
  return `<form class="card" id="pf"><h2>Partida programada</h2><p class="note">Esta mesa está siempre activa: cuando termina una partida los jugadores pueden pedir revancha y, si nadie la pide, se programa sola 15 minutos después. Los jugadores se suscriben pagando la entrada y no pueden cancelar: solo vos podés cerrar la mesa por hoy (se devuelven las entradas). Este formulario sirve para crearla la primera vez o para cambiar la hora, la entrada o los puntos.</p>
  <div id="pgs"></div>
  <label>Fecha y hora de inicio<input name="ini" type="datetime-local" required></label>
  <div class="row"><label style="flex:1">Entrada (0 = gratis)<input name="ep" type="number" min="0" max="100000" step="1" value="${en}"></label>
  <label style="flex:1">Puntos para eliminar<input name="lp" type="number" min="20" max="500" step="10" value="${li}"></label></div>
  <label>Máximo de jugadores (2 a 6)<input name="mp" type="number" min="2" max="6" step="1" value="${mx}"></label>
  ${pm.t?`<div class="${pm.bad?'err':'okm'}">${esc(pm.t)}</div>`:''}
  <button class="b1">Programar partida</button></form>`;
}
function progv(){
  const el=document.getElementById('pgs');if(!el)return;
  const m=fx.find(x=>x.id==='mesa-prog');
  const tm=x=>x&&x.toMillis?x.toMillis():0;
  const fh=ms=>new Date(ms).toLocaleString('es-AR',{weekday:'long',day:'2-digit',month:'long',hour:'2-digit',minute:'2-digit'});
  if(m&&tm(m.cierraHasta)>Date.now()){
    el.innerHTML=`<div class="u"><b>🔒 Cerrada por hoy</b><span class="note">Se reabre sola el ${esc(fh(tm(m.cierraHasta)))}.</span><button type="button" class="b1" data-a="progabrir">Reabrir ahora (se programa en 15 min)</button></div>`;return}
  if(!m||!m.inicio||!m.inicio.toDate){
    el.innerHTML=`<p class="note">${m?'Ahora no hay una hora programada: hay una partida en juego o se está esperando la revancha. Cuando termine, si nadie pide revancha, se programa sola 15 minutos después. Si pasó mucho tiempo y no se programó, usá el formulario de abajo.':'Todavía no creaste la partida programada. Usá el formulario de abajo.'}</p>${m?'<button type="button" class="b2" style="color:var(--bad)" data-a="progcerrar">Cerrar por hoy</button>':''}`;return}
  const cuando=m.inicio.toDate().toLocaleString('es-AR',{weekday:'long',day:'2-digit',month:'long',hour:'2-digit',minute:'2-digit'});
  el.innerHTML=`<div class="u"><div class="row"><b>Programada: ${esc(cuando)}</b><span class="mono gold">${m.uids.length}/${m.max}</span></div>
  <span class="note">Entrada ${fmt(m.entrada)} · pozo ${fmt(m.pozo||0)} · ${m.limite} puntos</span>
  <span class="note">Suscriptos: ${(m.jugadores||[]).map(j=>esc(j.name)).join(', ')||'nadie todavía'}</span>
  <button type="button" class="b2" style="color:var(--bad)" data-a="progcerrar">Cerrar por hoy${m.entrada>0&&m.uids.length?' y devolver entradas':''}</button></div>`;
}
function estados(){
  progv();
  FIJAS.forEach(([n])=>{const el=document.getElementById('st-'+n);if(!el)return;
    const m=fx.find(x=>x.id==='mesa-'+n);
    el.innerHTML=m?`${m.uids.length}/${m.max} sentados${m.uids.length?` <button type="button" class="b3" style="padding:4px 8px;color:var(--bad)" data-a="vaciar" data-id="${m.id}">Vaciar</button>`:''}`:'Sin crear';
  });
  const v=document.getElementById('viejas');
  if(v){const o=fx.filter(m=>!/^mesa-(4|prog)$/.test(m.id));
    v.innerHTML=o.length?`<p class="note">Hay ${o.length} mesa(s) vieja(s) abierta(s).</p><button type="button" class="b2" data-a="viejas">Borrar mesas viejas</button>`:''}
}
async function guardarFijas(f){
  const w=writeBatch(db),bloq=[];let hubo=0;
  for(const [n,nom] of FIJAS){
    const entrada=Math.floor(+f.get('e'+n)),limite=Math.floor(+f.get('l'+n));
    if(!(entrada>=0&&entrada<=100000)||!(limite>=20&&limite<=500)){fm={t:'Revisá la entrada (0 a 100000) y los puntos para eliminar (20 a 500).',bad:true};return view()}
    const ex=fx.find(x=>x.id==='mesa-'+n);
    if(ex&&ex.uids.length){bloq.push(nom);continue}
    w.set(doc(db,'mesas','mesa-'+n),{nombre:nom,entrada,max:n,limite,listos:[],reeng:entrada===0?0:(cfg.reenganche>0?cfg.reenganche:entrada),pozo:0,fija:true,prog:false,anfitrion:'',cuentaIni:serverTimestamp(),estado:'esperando',uids:[],jugadores:[],creada:serverTimestamp()});
    hubo++;
  }
  try{if(hubo)await w.commit();fm={t:'Mesas guardadas.'+(bloq.length?' No se cambió: '+bloq.join(', ')+' (tiene jugadores sentados).':''),bad:false}}
  catch(x){fm={t:'No se pudo guardar. Revisá las reglas de Firestore.',bad:true}}
  view();
}
function rankCard(){
  return `<div class="card"><h2>Ranking</h2><div class="note" id="rkn"></div><div id="rkl"></div>
  <button class="b1" data-a="png">Descargar ranking (PNG)</button><button class="b3" style="color:var(--bad)" data-a="limpiar">Limpiar ranking (poner en cero)</button>${navigator.canShare?'<button class="b2" data-a="share">Compartir por WhatsApp</button>':''}</div>`;
}
function rkv(){
  const el=document.getElementById('rkl');if(!el)return;const t=tabla();
  document.getElementById('rkn').textContent=t.length+' jugadores con partidas · el PNG incluye el top 20 (J · G · P · %)';
  el.innerHTML=t.slice(0,10).map((x,i)=>`<div class="mv"><span>${i+1}. ${esc(x.name)}</span><span class="mono">${x.j} · ${x.g} · ${x.p} · ${pc(x)}</span></div>`).join('')||'<p class="note">Todavía no hay partidas registradas.</p>';
}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
async function dibujar(){
  const t=tabla().slice(0,20);
  try{await Promise.all([document.fonts.load('800 40px "Plus Jakarta Sans"'),document.fonts.load('700 30px "JetBrains Mono"')])}catch(e){}
  const SANS='"Plus Jakarta Sans",system-ui,sans-serif',MONO='"JetBrains Mono",ui-monospace,monospace';
  const W=1080,RH=86,TOP=330,n=Math.max(t.length,1),H=TOP+n*RH+130;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#0e1b15';x.fillRect(0,0,W,H);
  x.fillStyle='#15271e';rr(x,30,30,W-60,H-60,36);x.fill();x.strokeStyle='#22392d';x.lineWidth=3;x.stroke();
  x.textBaseline='middle';x.textAlign='center';
  x.fillStyle='#f2c14e';x.font='800 66px '+SANS;x.fillText('🏆 RANKING CHINCHÓN',W/2,125);
  x.fillStyle='#8fa597';x.font='600 30px '+SANS;x.fillText('Actualizado el '+new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'}),W/2,200);
  const CX={j:650,g:750,p:850,pc:970};
  x.fillStyle='#8fa597';x.font='700 26px '+SANS;
  x.textAlign='left';x.fillText('JUGADOR',170,TOP-40);
  x.textAlign='center';x.fillText('JUG',CX.j,TOP-40);x.fillText('GAN',CX.g,TOP-40);x.fillText('PER',CX.p,TOP-40);x.fillText('VIC %',CX.pc,TOP-40);
  const cut=(s,w)=>{if(x.measureText(s).width<=w)return s;while(s.length>1&&x.measureText(s+'…').width>w)s=s.slice(0,-1);return s+'…'};
  if(!t.length){x.textAlign='center';x.fillStyle='#8fa597';x.font='600 34px '+SANS;x.fillText('Todavía no hay partidas registradas',W/2,TOP+RH/2)}
  t.forEach((p,i)=>{
    const y=TOP+i*RH,cy=y+RH/2-4;
    if(i%2===0){x.fillStyle='#1a3025';rr(x,60,y,W-120,RH-8,18);x.fill()}
    x.textAlign='center';x.fillStyle=i===0?'#f2c14e':'#e8f0ea';x.font='700 36px '+MONO;
    x.fillText(i<3?['🥇','🥈','🥉'][i]:String(i+1),115,cy);
    x.textAlign='left';x.font='800 36px '+SANS;x.fillStyle=i===0?'#f2c14e':'#e8f0ea';x.fillText(cut(p.name,430),170,cy);
    x.textAlign='center';x.font='700 34px '+MONO;
    x.fillStyle='#e8f0ea';x.fillText(String(p.j),CX.j,cy);
    x.fillStyle='#5fd08a';x.fillText(String(p.g),CX.g,cy);
    x.fillStyle='#e8665a';x.fillText(String(p.p),CX.p,cy);
    x.fillStyle='#f2c14e';x.fillText(pc(p),CX.pc,cy);
  });
  x.textAlign='center';x.fillStyle='#8fa597';x.font='600 26px '+SANS;
  x.fillText('JUG = jugadas · GAN = ganadas · PER = perdidas',W/2,H-80);
  return new Promise(r=>c.toBlob(r,'image/png'));
}
async function dibujarDia(){
  const MAXF=100,l=pd.slice(0,MAXF),extra=pd.length-l.length;
  const re=pd.filter(x=>!x.prueba),np=pd.length-re.length;
  const pozo=re.reduce((s,x)=>s+(x.pozo||0),0),prem=re.reduce((s,x)=>s+(x.premio||0),0);
  try{await Promise.all([document.fonts.load('800 40px "Plus Jakarta Sans"'),document.fonts.load('700 30px "JetBrains Mono"')])}catch(e){}
  const SANS='"Plus Jakarta Sans",system-ui,sans-serif',MONO='"JetBrains Mono",ui-monospace,monospace';
  const W=1080,RH=150,TOP=470,H=TOP+Math.max(l.length,1)*RH+(extra>0?70:0)+90;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#0e1b15';x.fillRect(0,0,W,H);
  x.fillStyle='#15271e';rr(x,30,30,W-60,H-60,36);x.fill();x.strokeStyle='#22392d';x.lineWidth=3;x.stroke();
  x.textBaseline='middle';x.textAlign='center';
  const [yy,mm,dd]=diaSel.split('-').map(Number);
  x.fillStyle='#f2c14e';x.font='800 62px '+SANS;x.fillText('📋 PARTIDAS DEL DÍA',W/2,120);
  x.fillStyle='#8fa597';x.font='600 32px '+SANS;x.fillText(new Date(yy,mm-1,dd).toLocaleDateString('es-AR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}),W/2,195);
  /* resumen */
  x.fillStyle='#1a3025';rr(x,60,250,W-120,170,24);x.fill();
  const cols=[['PARTIDAS',String(re.length),'#e8f0ea'],['POZO',fmt(pozo),'#e8f0ea'],['PREMIOS',fmt(prem),'#5fd08a'],['COMISIÓN',fmt(pozo-prem),'#f2c14e']];
  cols.forEach((k,i)=>{const cx=60+(W-120)/8+i*(W-120)/4;x.fillStyle='#8fa597';x.font='700 24px '+SANS;x.fillText(k[0],cx,300);x.fillStyle=k[2];x.font='700 34px '+MONO;x.fillText(k[1],cx,360)});
  if(np){x.fillStyle='#8fa597';x.font='600 24px '+SANS;x.fillText('🤖 '+np+' partida'+(np===1?'':'s')+' de prueba (no suman en los totales)',W/2,445)}
  const cut=(t,w)=>{if(x.measureText(t).width<=w)return t;while(t.length>1&&x.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'};
  if(!l.length){x.fillStyle='#8fa597';x.font='600 34px '+SANS;x.fillText('No hay partidas registradas ese día',W/2,TOP+RH/2)}
  l.forEach((p,i)=>{
    const y=TOP+i*RH;
    if(i%2===0){x.fillStyle='#1a3025';rr(x,60,y,W-120,RH-10,18);x.fill()}
    const h=p.fecha&&p.fecha.toDate?p.fecha.toDate().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):'';
    x.textAlign='left';x.fillStyle='#e8f0ea';x.font='800 34px '+SANS;x.fillText(cut(h+' · '+(p.prueba?'🤖 ':'')+(p.mesa||'Mesa'),620),90,y+34);
    x.textAlign='right';x.fillStyle='#f2c14e';x.font='700 34px '+MONO;x.fillText(p.prueba?'PRUEBA':fmt(p.pozo||0),W-90,y+34);
    x.textAlign='left';x.fillStyle='#8fa597';x.font='600 26px '+SANS;x.fillText(cut('Jugaron: '+(p.jugadores||[]).join(', '),W-180),90,y+78);
    x.fillStyle='#5fd08a';x.font='700 28px '+SANS;x.fillText(cut('🏆 Ganó '+(p.ganador||'?')+(p.prueba?'':' · premio '+fmt(p.premio||0)),W-180),90,y+116);
  });
  if(extra>0){x.textAlign='center';x.fillStyle='#8fa597';x.font='600 26px '+SANS;x.fillText('… y '+extra+' partida'+(extra===1?'':'s')+' más (se ven en el panel)',W/2,TOP+l.length*RH+30)}
  return new Promise(r=>c.toBlob(r,'image/png'));
}
function pruebaCard(){
  return `<div class="card"><h2>Mesa de prueba (bot)</h2><p class="note">Una mesa aparte, gratis, donde el usuario juega contra un bot. No usa saldo ni suma al ranking.</p><div class="row"><b>${cfg.prueba?'ACTIVADA':'DESACTIVADA'}</b><button type="button" class="${cfg.prueba?'b2':'b1'}" data-a="prueba">${cfg.prueba?'Desactivar':'Activar'}</button></div></div>`;
}
async function guardarProg(f){
  const ex=fx.find(x=>x.id==='mesa-prog');
  if(ex&&ex.uids.length){pm={t:'Hay jugadores suscriptos. Cerrá la mesa por hoy (se devuelven las entradas) antes de programar otra.',bad:true};return view()}
  const ini=new Date(f.get('ini')),entrada=Math.floor(+f.get('ep')),limite=Math.floor(+f.get('lp')),max=Math.floor(+f.get('mp'));
  if(isNaN(ini.getTime())||ini.getTime()<Date.now()+60000){pm={t:'Elegí una fecha y hora futura (al menos 1 minuto desde ahora).',bad:true};return view()}
  if(!(entrada>=0&&entrada<=100000)||!(limite>=20&&limite<=500)||!(max>=2&&max<=6)){pm={t:'Revisá la entrada (0 a 100000), los puntos (20 a 500) y los jugadores (2 a 6).',bad:true};return view()}
  try{
    await setDoc(doc(db,'mesas','mesa-prog'),{nombre:'Partida programada',entrada,max,limite,listos:[],reeng:entrada===0?0:(cfg.reenganche>0?cfg.reenganche:entrada),pozo:0,fija:true,prog:true,anfitrion:'',cuentaIni:serverTimestamp(),inicio:ini,estado:'esperando',uids:[],jugadores:[],creada:serverTimestamp()});
    pm={t:'Partida programada.',bad:false};
  }catch(x){pm={t:'No se pudo guardar. Revisá que hayas publicado las reglas nuevas de Firestore.',bad:true}}
  view();
}
async function accion(a,b){
  if(a==='limpiar'){
    if(!rk.length){alert('El ranking ya está vacío.');return}
    if(!confirm('¿Borrar TODO el ranking ('+rk.length+' jugadores)? No se puede deshacer.'))return;
    if(!confirm('Última confirmación: el ranking queda en cero para todos. ¿Seguro?'))return;
    b.disabled=true;
    try{for(let i=0;i<rk.length;i+=400){const w=writeBatch(db);rk.slice(i,i+400).forEach(x=>w.delete(doc(db,'ranking',x.id)));await w.commit()}}
    catch(x){alert('No se pudo limpiar el ranking. ¿Publicaste las reglas nuevas?')}
    b.disabled=false;return;
  }
  if(a==='progcerrar'){
    const m=fx.find(x=>x.id==='mesa-prog');if(!m)return;
    if(!confirm('¿Cerrar la partida programada por hoy? No se programan más partidas hasta mañana a las 00:00.'+(m.entrada>0&&m.uids.length?' Se devuelve la entrada ('+fmt(m.entrada)+') a cada suscripto.':'')))return;
    b.disabled=true;
    try{
      const man=new Date();man.setHours(24,0,0,0);
      const w=writeBatch(db);
      w.update(doc(db,'mesas','mesa-prog'),{uids:[],jugadores:[],pozo:0,listos:[],cuentaIni:serverTimestamp(),inicio:null,reprogDesde:null,cierraHasta:man});
      if(m.entrada>0)m.uids.forEach(u=>w.update(doc(db,'users',u),{saldo:increment(m.entrada)}));
      await w.commit();
    }catch(x){alert('No se pudo cerrar. ¿Publicaste las reglas nuevas de Firestore?');b.disabled=false}
    return;
  }
  if(a==='progabrir'){
    b.disabled=true;
    try{await updateDoc(doc(db,'mesas','mesa-prog'),{cierraHasta:null,reprogDesde:null,inicio:new Date(Date.now()+15*60000)})}
    catch(x){alert('No se pudo reabrir.');b.disabled=false}
    return;
  }
  if(a==='prueba'){b.disabled=true;try{await setDoc(doc(db,'config','general'),{prueba:!cfg.prueba},{merge:true})}catch(x){alert('No se pudo cambiar.')}b.disabled=false;return}
  if(a==='pngdia'||a==='sharedia'){
    if(!pd.length){alert('No hay partidas registradas ese día.');return}
    b.disabled=true;
    try{
      const blob=await dibujarDia(),nom='partidas-chinchon-'+diaSel+'.png';
      if(a==='sharedia'){
        const f=new File([blob],nom,{type:'image/png'});
        if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'Partidas del día'});
        else alert('Este navegador no puede compartir imágenes. Usá el botón Descargar.');
      }else{
        const url=URL.createObjectURL(blob),l=document.createElement('a');
        l.href=url;l.download=nom;document.body.appendChild(l);l.click();l.remove();
        setTimeout(()=>URL.revokeObjectURL(url),5000);
      }
    }catch(x){if(!x||x.name!=='AbortError')alert('No se pudo generar la imagen.')}
    b.disabled=false;return;
  }
  if(a==='png'||a==='share'){
    b.disabled=true;
    try{
      const blob=await dibujar(),nom='ranking-chinchon-'+new Date().toISOString().slice(0,10)+'.png';
      if(a==='share'){
        const f=new File([blob],nom,{type:'image/png'});
        if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'Ranking Chinchón'});
        else alert('Este navegador no puede compartir imágenes. Usá el botón Descargar.');
      }else{
        const url=URL.createObjectURL(blob),l=document.createElement('a');
        l.href=url;l.download=nom;document.body.appendChild(l);l.click();l.remove();
        setTimeout(()=>URL.revokeObjectURL(url),5000);
      }
    }catch(x){if(!x||x.name!=='AbortError')alert('No se pudo generar la imagen.')}
    b.disabled=false;return;
  }
  if(a==='vaciar'){
    const m=fx.find(x=>x.id===b.dataset.id);if(!m||!m.uids.length)return;
    if(!confirm('¿Vaciar '+m.nombre+'?'+(m.entrada>0?' Se devuelve la entrada ('+fmt(m.entrada)+') a cada jugador.':'')))return;
    b.disabled=true;
    try{
      const w=writeBatch(db);
      w.update(doc(db,'mesas',m.id),{uids:[],jugadores:[],pozo:0,listos:[],cuentaIni:serverTimestamp()});
      if(m.entrada>0)m.uids.forEach(u=>w.update(doc(db,'users',u),{saldo:increment(m.entrada)}));
      await w.commit();
    }catch(x){alert('No se pudo vaciar la mesa.');b.disabled=false}
    return;
  }
  if(a==='viejas'){
    const l=fx.filter(m=>!/^mesa-(4|prog)$/.test(m.id));if(!l.length)return;
    if(!confirm('¿Borrar '+l.length+' mesa(s) vieja(s)? Se devuelven las entradas a quienes estén sentados.'))return;
    b.disabled=true;
    try{
      const w=writeBatch(db);
      l.forEach(m=>{w.delete(doc(db,'mesas',m.id));if(m.entrada>0)(m.uids||[]).forEach(u=>w.update(doc(db,'users',u),{saldo:increment(m.entrada)}))});
      await w.commit();
    }catch(x){alert('No se pudo borrar.');b.disabled=false}
  }
}
/* ---------- Mantener la partida programada siempre activa ---------- */
let progAuto=false;
setInterval(async()=>{
  if(!U||!me||!me.admin||progAuto)return;
  const p=fx.find(x=>x.id==='mesa-prog');if(!p||p.inicio||(p.uids||[]).length)return;
  const t=x=>x&&x.toMillis?x.toMillis():0,now=Date.now(),cierre=t(p.cierraHasta),desde=t(p.reprogDesde);
  if(cierre){if(now<cierre)return}else if(!desde||now<desde)return;
  progAuto=true;
  try{await updateDoc(doc(db,'mesas','mesa-prog'),{inicio:new Date(now+15*60000),reprogDesde:null,cierraHasta:null})}catch(e){}
  setTimeout(()=>{progAuto=false},5000);
},2000);
/* ---------- Registro de partidas del día ---------- */
let pd=[],unPart=null;
const hoyStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let diaSel=hoyStr();
function subPartidas(){
  if(unPart)unPart();
  const [y,m,d]=diaSel.split('-').map(Number),a=new Date(y,m-1,d),b=new Date(y,m-1,d+1);
  unPart=onSnapshot(query(collection(db,'partidas'),where('fecha','>=',a),where('fecha','<',b),orderBy('fecha','desc'),limit(300)),
    s=>{pd=s.docs.map(x=>({id:x.id,...x.data({serverTimestamps:'estimate'})}));ptv()},
    ()=>{pd=[];ptv()});
}
function partidasCard(){
  return `<div class="card"><h2>Partidas del día</h2>
  <label>Día<input id="dia" type="date" value="${diaSel}" max="${hoyStr()}"></label>
  <div class="note" id="ptn"></div><div id="ptl"></div>
  <button class="b1" data-a="pngdia">Descargar resultados del día (PNG)</button>${navigator.canShare?'<button class="b2" data-a="sharedia">Compartir por WhatsApp</button>':''}</div>`;
}
function ptv(){
  const el=document.getElementById('ptl'),nt=document.getElementById('ptn');if(!el)return;
  const re=pd.filter(x=>!x.prueba),np=pd.length-re.length;
  const pozo=re.reduce((s,x)=>s+(x.pozo||0),0),prem=re.reduce((s,x)=>s+(x.premio||0),0);
  nt.innerHTML=pd.length?`<b class="mono gold">${re.length}</b> partida${re.length===1?'':'s'} · pozo total <b class="mono">${fmt(pozo)}</b> · premios <b class="mono">${fmt(prem)}</b> · comisión de la casa <b class="mono gold">${fmt(pozo-prem)}</b>${np?` · 🤖 ${np} de prueba (no suman)`:''}`:'';
  el.innerHTML=pd.length?pd.map(x=>{
    const h=x.fecha&&x.fecha.toDate?x.fecha.toDate().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):'';
    return `<div class="u"><div class="row"><b>${h} · ${x.prueba?'🤖 ':''}${esc(x.mesa||'Mesa')}</b><span class="mono gold">${x.prueba?'PRUEBA':fmt(x.pozo||0)}</span></div>
    <span class="note">Jugaron: ${(x.jugadores||[]).map(esc).join(', ')}</span>
    <span class="note">🏆 Ganó ${esc(x.ganador||'?')}${x.prueba?'':' · premio '+fmt(x.premio||0)}</span></div>`}).join(''):'<p class="note">No hay partidas registradas ese día.</p>';
}
document.addEventListener('change',e=>{if(e.target.id==='dia'&&e.target.value){diaSel=e.target.value;subPartidas()}});
function lista(){
  const el=document.getElementById('lista');if(!el)return;
  const t=q.trim().toLowerCase();
  const l=us.filter(u=>!t||(u.name||'').toLowerCase().includes(t)||u.id.slice(0,6).toLowerCase().includes(t)).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const ct=document.getElementById('cont');if(ct)ct.textContent=us.length+' registrados · '+us.filter(x=>x.bloqueado).length+' bloqueados';
  el.innerHTML=l.length?l.map(u=>`<div class="u"><div class="row"><b>${esc(u.name||'?')}${u.bloqueado?' 🚫':''}${u.admin?' (admin)':''}</b><span class="mono gold">${fmt(u.saldo||0)}</span></div><span class="note">Código ${u.id.slice(0,6)}</span>
    <div class="row"><input id="m-${u.id}" type="number" min="1" step="1" placeholder="Monto" aria-label="Monto para ${esc(u.name||'')}"><button class="b1" data-a="cred" data-u="${u.id}">Acreditar</button><button class="b2" data-a="deb" data-u="${u.id}">Debitar</button></div>${u.admin||u.id===U.uid?'':`<div class="row"><button class="b2" data-a="blq" data-u="${u.id}">${u.bloqueado?'Desbloquear':'Bloquear'}</button><button class="b3" style="color:var(--bad)" data-a="del" data-u="${u.id}">Eliminar</button></div>`}</div>`).join(''):'<p class="note">No hay jugadores con ese dato.</p>';
}
function hist(){
  const el=document.getElementById('hist');if(!el)return;
  el.innerHTML=mv.length?mv.map(m=>`<div class="mv"><span>${esc(m.nombre)}</span><span class="mono" style="color:${m.monto>0?'var(--ok)':'var(--bad)'}">${m.monto>0?'+':''}${fmt(m.monto)}</span><span class="note">${m.creado?m.creado.toDate().toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'}):''}</span></div>`).join(''):'<p class="note">Todavía no hay movimientos.</p>';
}
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;lista()}});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=new FormData(e.target);err='';ok='';
  if(e.target.id==='mf')return guardarFijas(f);
  if(e.target.id==='pf')return guardarProg(f);
  try{
    if(e.target.id==='f')await signInWithEmailAndPassword(auth,f.get('email'),f.get('pass'));
    if(e.target.id==='cf'){
      const comision=Math.floor(+f.get('com')),entradas=[...new Set(String(f.get('ent')).split(',').map(x=>Math.floor(+x.trim())).filter(n=>n>0))].slice(0,6);
      const turno=Math.floor(+f.get('tur')),espera=Math.floor(+f.get('esp')),reenganche=Math.floor(+f.get('ree')),segReeng=Math.floor(+f.get('sre'));
      if(!(comision>=0&&comision<=50)||!entradas.length||!(turno>=10&&turno<=120)||!(espera>=10&&espera<=120)||!(reenganche>=0&&reenganche<=100000)||!(segReeng>=5&&segReeng<=120)){err='Revisá la comisión (0 a 50), los segundos de turno y de espera (10 a 120), el reenganche (costo y segundos) y las entradas.';return view()}
      await setDoc(doc(db,'config','general'),{prueba:!!cfg.prueba,comision,entradas,turno,espera,reenganche,segReeng,whatsapp:String(f.get('wa')).replace(/\D/g,'')});
      ok='Configuración guardada.';view();
    }
  }catch(x){err=x.code==='auth/invalid-credential'?'Correo o contraseña incorrectos.':'No se pudo completar. Probá de nuevo.';view()}
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='salir')return signOut(auth);
  if(['png','share','pngdia','sharedia','vaciar','viejas','prueba','limpiar','progcerrar','progabrir'].includes(a))return accion(a,b);
  if(a==='blq'||a==='del'){
    const u=us.find(x=>x.id===b.dataset.u);if(!u||u.admin)return;
    if(a==='blq'){
      const nuevo=!u.bloqueado;
      if(!confirm((nuevo?'Bloquear':'Desbloquear')+' a '+u.name+'?'))return;
      b.disabled=true;
      try{await updateDoc(doc(db,'users',u.id),{bloqueado:nuevo})}catch(x){alert('No se pudo guardar el cambio.')}
      b.disabled=false;return;
    }
    if(!confirm('Eliminar a '+u.name+'? Se borran sus datos y su saldo ('+fmt(u.saldo||0)+'). No se puede deshacer. Si está sentado en una mesa, sacalo antes.'))return;
    b.disabled=true;
    try{
      const w=writeBatch(db);
      w.delete(doc(db,'users',u.id));
      w.set(doc(db,'bloqueados',u.id),{nombre:u.name,por:me.name,creado:serverTimestamp()});
      if((u.saldo||0)>0)w.set(doc(collection(db,'movimientos')),{uid:u.id,nombre:u.name+' (eliminado)',monto:-(u.saldo),por:me.name,creado:serverTimestamp()});
      await w.commit();
    }catch(x){alert('No se pudo eliminar.');b.disabled=false}
    return;
  }
  const id=b.dataset.u,n=Math.floor(+document.getElementById('m-'+id).value);
  if(!(n>0))return;
  const u=us.find(x=>x.id===id),sg=a==='cred'?1:-1;
  if(sg<0&&n>(u.saldo||0)){alert('El jugador no tiene tanto saldo.');return}
  if(!confirm(`${sg>0?'Acreditar':'Debitar'} ${fmt(n)} a ${u.name}?`))return;
  b.disabled=true;
  try{
    const w=writeBatch(db);
    w.update(doc(db,'users',id),{saldo:increment(sg*n)});
    w.set(doc(collection(db,'movimientos')),{uid:id,nombre:u.name,monto:sg*n,por:me.name,creado:serverTimestamp()});
    await w.commit();
  }catch(x){alert('No se pudo guardar el movimiento.')}
  b.disabled=false;
});
</script>
