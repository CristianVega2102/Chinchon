<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chinchón · Salas</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1b15;--panel:#15271e;--line:#22392d;--gold:#f2c14e;--ink:#e8f0ea;--mute:#8fa597;--ok:#5fd08a;--bad:#e8665a;--sans:'Plus Jakarta Sans',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:460px;padding:14px 14px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
h1{font-size:20px;font-weight:800}h2{font-size:16px;font-weight:800}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font-family:var(--mono);font-weight:700;font-size:13px;background:#1d3a2c;color:var(--ok);padding:6px 10px;border-radius:999px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
input,select{font:inherit;width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0e1b15;color:var(--ink)}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:13px;font-size:15px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.b1{background:var(--gold);color:#2a2100}.b2{background:#1d3a2c;color:var(--ok)}.b3{background:none;color:var(--mute);padding:8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:2px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs .on{background:var(--gold);color:#2a2100}.tabs button{background:#1d3a2c;color:var(--ink)}
.err{color:var(--bad);font-size:13px;font-weight:700}.note{color:var(--mute);font-size:12px}
.mono{font-family:var(--mono);font-weight:700}.gold{color:var(--gold)}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:130px;justify-content:center}
.seat.me{border-color:var(--gold)}.seat.empty{opacity:.6;border-style:dashed}
.av{width:52px;height:52px;border-radius:50%;background:#24493a;display:grid;place-items:center;font-weight:800;font-size:20px}
.tag{font-size:11px;color:var(--gold);font-family:var(--mono)}
.pozo{background:#2b2a14;border:1px solid #4a4420;border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.pozo b{font-family:var(--mono);color:var(--gold);font-size:22px}
a.b1{text-decoration:none;text-align:center;display:block;border-radius:14px;padding:13px;font-weight:800;background:var(--gold);color:#2a2100}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,onSnapshot,collection,query,where,writeBatch,serverTimestamp,arrayUnion,arrayRemove,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyCkJfAUeCfppXpnB4K6I8z5u_OmsH5AcxY",
  authDomain:"chinchon-mesa.firebaseapp.com",
  projectId:"chinchon-mesa",
  storageBucket:"chinchon-mesa.firebasestorage.app",
  messagingSenderId:"973919776041",
  appId:"1:973919776041:web:b3fbf3e89b1d48c46c9b38"
});
const auth=getAuth(app),db=getFirestore(app);
const A=document.getElementById('app');
const fmt=n=>'$'+Math.round(n).toLocaleString('es-AR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let U=null,me=null,mesas=[],mia=null,unsubs=[],modo='in',err='',busy=false;

onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];U=u;me=null;mesas=[];mia=null;
  if(u){
    unsubs.push(onSnapshot(doc(db,'users',u.uid),s=>{me=s.exists()?s.data():null;view()}));
    unsubs.push(onSnapshot(query(collection(db,'mesas'),where('estado','==','esperando')),s=>{
      mesas=s.docs.map(d=>({id:d.id,...d.data()})).filter(m=>m.uids.length);
      mia=mesas.find(m=>m.uids.includes(u.uid))||null;view();
    }));
  }
  view();
});

const MSG={'auth/email-already-in-use':'Ese correo ya tiene una cuenta. Probá entrar.','auth/invalid-credential':'Correo o contraseña incorrectos.','auth/weak-password':'La contraseña necesita al menos 6 caracteres.','auth/invalid-email':'Escribí un correo válido.','permission-denied':'No se pudo: la mesa cambió o no alcanza el saldo.'};
const fail=e=>{err=MSG[e.code]||MSG[(e.code||'').replace('auth/','')]||'No se pudo completar. Probá de nuevo.';busy=false;view()};

function view(){
  if(!U)return A.innerHTML=authView();
  if(!me)return A.innerHTML='<p class="note">Cargando tu cuenta…</p>';
  A.innerHTML=mia?salaView():lobbyView();
}
function authView(){
  const reg=modo==='up';
  return `<h1>Chinchón</h1><p class="note">Mesas de 4 con fichas de práctica. Sin dinero real.</p>
  <div class="tabs"><button class="${reg?'':'on'}" data-a="modo" data-v="in">Entrar</button><button class="${reg?'on':''}" data-a="modo" data-v="up">Crear cuenta</button></div>
  <form class="card" id="f">
    ${reg?'<input name="nombre" placeholder="Tu nombre en la mesa" maxlength="16" required autocomplete="nickname">':''}
    <input name="email" type="email" placeholder="Correo" required autocomplete="email">
    <input name="pass" type="password" placeholder="Contraseña (mínimo 6)" required minlength="6" autocomplete="${reg?'new-password':'current-password'}">
    ${err?`<div class="err">${err}</div>`:''}
    <button class="b1" ${busy?'disabled':''}>${reg?'Crear cuenta y recibir 5.000 fichas':'Entrar'}</button>
  </form>`;
}
function head(){return `<div class="bar"><h1>${esc(me.name)}</h1><div class="row"><span class="chip">${fmt(me.saldo)}</span><button class="b3" data-a="salir">Salir</button></div></div>`}
function lobbyView(){
  const list=mesas.length?mesas.map(m=>`<div class="card"><div class="row"><h2>${esc(m.nombre)}</h2><span class="mono gold">${m.uids.length}/4</span></div>
    <div class="row"><span class="note">Entrada</span><span class="mono">${fmt(m.entrada)}</span></div>
    <div class="row"><span class="note">Pozo</span><span class="mono gold">${fmt(m.pozo)}</span></div>
    <button class="b2" data-a="unirse" data-id="${m.id}" ${busy||m.uids.length>=4||me.saldo<m.entrada?'disabled':''}>${me.saldo<m.entrada?'Saldo insuficiente':m.uids.length>=4?'Mesa llena':'Sentarme'}</button></div>`).join('')
    :'<p class="note">No hay mesas abiertas. Creá la primera.</p>';
  return `${head()}
  <div class="card"><h2>Crear mesa</h2><select id="ent" aria-label="Entrada"><option value="500">Entrada $500</option><option value="1000">Entrada $1.000</option><option value="2000">Entrada $2.000</option></select>
  ${err?`<div class="err">${err}</div>`:''}<button class="b1" data-a="crear" ${busy?'disabled':''}>Crear y sentarme</button></div>
  <h2>Mesas abiertas</h2>${list}`;
}
function salaView(){
  const m=mia,js=m.jugadores,full=js.length===4;
  const seats=[0,1,2,3].map(i=>{const j=js[i];
    return j?`<div class="seat ${j.uid===U.uid?'me':''}"><div class="av">${esc(j.name[0].toUpperCase())}</div><b>${esc(j.name)}</b>${i===0?'<span class="tag">ANFITRIÓN</span>':''}<span class="tag" style="color:var(--ok)">Sentado</span></div>`
      :`<div class="seat empty"><div class="av">?</div><b>Buscando rival…</b><span class="tag">Puesto libre</span></div>`}).join('');
  const txt=encodeURIComponent(`Te espero en ${m.nombre} de Chinchón. Entrada ${fmt(m.entrada)} en fichas: ${location.href}`);
  return `${head()}<h1>${esc(m.nombre)}</h1>
  <div class="pozo"><span class="note">Entrada ${fmt(m.entrada)}</span><div style="text-align:right"><span class="note">Pozo acumulado</span><br><b>${fmt(m.pozo)}</b></div></div>
  <div class="card"><div class="row"><h2>${full?'Mesa completa':'Esperando jugadores…'}</h2><span class="mono gold">${js.length}/4</span></div></div>
  <div class="seats">${seats}</div>
  <button class="b1" disabled>Iniciar partida</button>
  <p class="note">El juego en línea se conecta en el próximo paso. Por ahora podés armar la mesa e invitar gente.</p>
  <a class="b1" href="https://wa.me/?text=${txt}" target="_blank" rel="noopener">Invitar amigo por WhatsApp</a>
  <button class="b2" data-a="salirMesa" ${busy?'disabled':''}>Salir de la mesa (te devolvemos la entrada)</button>`;
}

document.addEventListener('submit',async e=>{
  if(e.target.id!=='f')return;e.preventDefault();
  const f=new FormData(e.target);err='';busy=true;view();
  try{
    if(modo==='up'){
      const c=await createUserWithEmailAndPassword(auth,f.get('email'),f.get('pass'));
      await setDoc(doc(db,'users',c.user.uid),{name:String(f.get('nombre')).trim().slice(0,16),saldo:5000,admin:false,creado:serverTimestamp()});
    }else await signInWithEmailAndPassword(auth,f.get('email'),f.get('pass'));
    busy=false;
  }catch(x){fail(x)}
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='modo'){modo=b.dataset.v;err='';return view()}
  if(a==='salir')return signOut(auth);
  err='';busy=true;view();
  try{
    const uref=doc(db,'users',U.uid),batch=writeBatch(db);
    if(a==='crear'){
      const entrada=+document.getElementById('ent').value;
      if(me.saldo<entrada)throw{code:'permission-denied'};
      const r=doc(collection(db,'mesas'));
      batch.set(r,{nombre:'Mesa #'+(100+Math.floor(Math.random()*900)),entrada,pozo:entrada,anfitrion:U.uid,estado:'esperando',uids:[U.uid],jugadores:[{uid:U.uid,name:me.name}],creada:serverTimestamp()});
      batch.update(uref,{saldo:increment(-entrada)});
    }
    if(a==='unirse'){
      const m=mesas.find(x=>x.id===b.dataset.id);
      batch.update(doc(db,'mesas',m.id),{uids:arrayUnion(U.uid),jugadores:arrayUnion({uid:U.uid,name:me.name}),pozo:increment(m.entrada)});
      batch.update(uref,{saldo:increment(-m.entrada)});
    }
    if(a==='salirMesa'){
      const m=mia;
      batch.update(doc(db,'mesas',m.id),{uids:arrayRemove(U.uid),jugadores:arrayRemove(m.jugadores.find(j=>j.uid===U.uid)),pozo:increment(-m.entrada)});
      batch.update(uref,{saldo:increment(m.entrada),mesaSalida:m.id});
    }
    await batch.commit();busy=false;view();
  }catch(x){fail(x)}
});
</script>
</body>
</html>
